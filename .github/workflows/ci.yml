name: ci

on:
  push:
  pull_request:

jobs:
  schemas:
    name: Schemas and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/schema-check/package-lock.json
      - run: npm ci
        working-directory: tools/schema-check
      - run: npm run check
        working-directory: tools/schema-check

  java:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B -q verify
